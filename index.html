<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UACE Advanced Analysis · Mawerere Francis</title>
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- html2canvas for PDF rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #eef2f7 0%, #f8fafc 100%);
            min-height: 100vh;
        }
        /* Login page */
        #loginPage {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #0b2b40;
            background-image: radial-gradient(circle at 30% 40%, #1a4b63, #07212e);
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            width: 420px;
            padding: 2.5rem 2rem;
            border-radius: 32px;
            box-shadow: 0 30px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.2) inset;
            text-align: center;
            animation: fadeIn 0.6s ease;
        }
        .login-card h2 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #0b486b, #1b6b8f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.25rem;
        }
        .login-card .sub {
            color: #1e4b62;
            font-weight: 500;
            margin-bottom: 2rem;
            border-bottom: 1px dashed #9bb7c9;
            padding-bottom: 0.8rem;
        }
        .input-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }
        .input-group label {
            font-weight: 600;
            color: #145369;
            display: block;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #cbdbe9;
            border-radius: 40px;
            font-size: 1rem;
            transition: 0.2s;
            background: white;
        }
        .input-group input:focus {
            border-color: #1f7990;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 102, 128, 0.2);
        }
        .login-btn {
            background: linear-gradient(145deg, #136b80, #0a4b5e);
            color: white;
            border: none;
            padding: 14px 0;
            width: 100%;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 10px 18px -8px #094452;
            transition: 0.15s;
            margin-top: 1rem;
        }
        .login-btn:hover {
            background: linear-gradient(145deg, #0f7f99, #0b5e75);
            transform: scale(1.01);
        }
        #loginError {
            color: #b00020;
            font-weight: 500;
            margin-top: 1rem;
        }
        .developer-credit {
            margin-top: 2.2rem;
            padding-top: 1.2rem;
            border-top: 2px dashed #a0c0d0;
            color: #10455b;
            font-size: 1.1rem;
            font-weight: 500;
        }
        .developer-credit span {
            font-weight: 700;
            color: #003153;
        }
        .developer-credit small {
            display: block;
            font-size: 0.9rem;
            color: #226578;
            margin-top: 6px;
        }
        /* Main page */
        #mainPage {
            display: none;
            padding: 30px 25px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
            background: white;
            padding: 16px 30px;
            border-radius: 60px;
            box-shadow: 0 10px 20px rgba(0,32,64,0.1);
        }
        .app-header h1 {
            color: #0b3f51;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn-group button {
            background: white;
            border: 2px solid #10687c;
            color: #10687c;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.15s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }
        .btn-group button:hover {
            background: #10687c;
            color: white;
            border-color: #10687c;
        }
        .btn-group .primary-btn {
            background: #10687c;
            color: white;
            border: 2px solid #10687c;
        }
        .btn-group .primary-btn:hover {
            background: #0b4f60;
        }
        .logout-btn {
            background: #a03d3d !important;
            border-color: #8b2e2e !important;
            color: white !important;
        }
        .logout-btn:hover {
            background: #7f2f2f !important;
        }
        .upload-area {
            background: white;
            padding: 25px;
            border-radius: 36px;
            margin-bottom: 25px;
            box-shadow: 0 10px 18px rgba(0,40,60,0.1);
            display: flex;
            align-items: center;
            gap: 25px;
            flex-wrap: wrap;
        }
        .file-label {
            background: #e3f0f5;
            padding: 14px 28px;
            border-radius: 40px;
            font-weight: 600;
            color: #105e74;
            cursor: pointer;
            border: 2px dashed #3f9eb7;
        }
        .file-label input {
            display: none;
        }
        .info-cards {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 20px 30px;
            box-shadow: 0 12px 24px -8px rgba(2, 60, 80, 0.2);
            flex: 1 1 200px;
            border: 1px solid rgba(100,180,200,0.3);
        }
        .card h3 {
            color: #0b5f78;
            font-weight: 600;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }
        .card .big-number {
            font-size: 3rem;
            font-weight: 800;
            color: #0a3a48;
            line-height: 1;
        }
        .grade-summary-table {
            background: white;
            border-radius: 28px;
            padding: 25px;
            margin: 30px 0;
            box-shadow: 0 12px 28px rgba(0,50,70,0.15);
        }
        .grade-summary-table table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 1.2rem;
        }
        .grade-summary-table th {
            background: #104f63;
            color: white;
            padding: 14px 0;
            font-weight: 600;
        }
        .grade-summary-table td {
            padding: 18px 0;
            background: #f6fbfe;
            border: 1px solid #bdd7e4;
            font-weight: 600;
            color: #103f50;
        }
        .section-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 40px 0 20px;
            color: #0b4153;
            border-left: 10px solid #0d6f88;
            padding-left: 20px;
        }
        .best-table, .points-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        .best-table th, .points-table th {
            background: #063b49;
            color: white;
            padding: 12px 6px;
            font-weight: 600;
        }
        .best-table td, .points-table td {
            padding: 10px 6px;
            border-bottom: 1px solid #cbdbe9;
            text-align: center;
        }
        .best-table tr:nth-child(even), .points-table tr:nth-child(even) {
            background: #f3f9ff;
        }
        .badge {
            background: #0d6f88;
            color: white;
            border-radius: 40px;
            padding: 4px 12px;
            font-weight: 500;
        }
        .chart-row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin: 40px 0;
        }
        .chart-box {
            flex: 1 1 400px;
            background: white;
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        canvas {
            max-height: 300px;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            color: #1d6177;
            font-weight: 500;
        }
        @media print {
            .no-print, .btn-group, .upload-area, footer, .chart-row { display: none; }
            body { background: white; }
            #mainPage { display: block; padding: 0; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="login-card">
            <h2>UACE</h2>
            <div class="sub">Advanced Analysis System</div>
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" value="admin">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" value="1234">
            </div>
            <button class="login-btn" onclick="login()">LOGIN & ACCESS</button>
            <p id="loginError"></p>
            <div class="developer-credit">
                <span>Developed by Mawerere Francis</span><br>
                <small>📞 TEL: 0788223215 &nbsp; | &nbsp; WhatsApp: +256788223215</small>
            </div>
        </div>
    </div>

    <!-- MAIN APPLICATION -->
    <div id="mainPage">
        <div class="app-header">
            <h1>📊 UACE RESULT ANALYZER</h1>
            <div class="btn-group">
                <button class="primary-btn" onclick="analyze()">▶ Analyze</button>
                <button onclick="window.print()">🖨️ Print</button>
                <button onclick="downloadExcel()">📥 Excel</button>
                <button onclick="downloadPDF()">📄 PDF</button>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="upload-area no-print">
            <div class="file-label">
                📂 Choose Excel File
                <input type="file" id="excelFile" accept=".xlsx,.xls">
            </div>
            <span style="color:#136476;">Upload UACE sheet (columns: IndexNo, Sex, Candidate_Name, Res. Code, Subjects)</span>
        </div>

        <!-- dynamic report area -->
        <div id="reportArea"></div>
        <!-- charts -->
        <div class="chart-row no-print" id="chartRow" style="display: none;">
            <div class="chart-box">
                <canvas id="gradeChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="subjectChart"></canvas>
            </div>
        </div>
        <footer class="no-print">UACE Analytics © Mawerere Francis — 0788223215 / +256788223215</footer>
    </div>

    <script>
        (function() {
            // ---------- CONFIG ----------
            const gradePoints = { 'A':6, 'B':5, 'C':4, 'D':3, 'E':2, 'O':1, 'F':0 };
            const numToLetter = { 1:'A',2:'A',3:'B',4:'B',5:'C',6:'C',7:'D',8:'D',9:'F' };

            // global data stores
            let gradeSummary = null;
            let candidatePoints = [];
            let subjectStats = null;
            let bestFifteen = [];

            // DOM elements
            const loginPage = document.getElementById('loginPage');
            const mainPage = document.getElementById('mainPage');
            const loginError = document.getElementById('loginError');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const fileInput = document.getElementById('excelFile');
            const reportArea = document.getElementById('reportArea');
            const chartRow = document.getElementById('chartRow');

            // ---------- LOGIN ----------
            window.login = function() {
                const user = usernameInput.value.trim();
                const pwd = passwordInput.value.trim();
                if (user === 'admin' && pwd === '1234') {
                    loginPage.style.display = 'none';
                    mainPage.style.display = 'block';
                    loginError.innerText = '';
                } else {
                    loginError.innerText = '❌ Invalid credentials. Use admin / 1234';
                }
            };

            // Enter key login
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && loginPage.style.display !== 'none') {
                    window.login();
                }
            });

            // ---------- LOGOUT (NEW) ----------
            window.logout = function() {
                // Clear any existing data
                reportArea.innerHTML = '';
                chartRow.style.display = 'none';
                // Reset file input
                fileInput.value = '';
                // Hide main, show login
                mainPage.style.display = 'none';
                loginPage.style.display = 'flex';
                // Optionally clear any charts
                const gradeCanvas = document.getElementById('gradeChart');
                const subjectCanvas = document.getElementById('subjectChart');
                Chart.getChart(gradeCanvas)?.destroy();
                Chart.getChart(subjectCanvas)?.destroy();
            };

            // ---------- PARSING ----------
            function parseOverallGrade(gradeToken) {
                if (!gradeToken) return 'F';
                const trimmed = gradeToken.trim();
                if (trimmed.length === 0) return 'F';
                const firstChar = trimmed.charAt(0);
                if (/[A-Za-z]/.test(firstChar)) {
                    return firstChar.toUpperCase();
                } else if (/[0-9]/.test(firstChar)) {
                    const num = parseInt(trimmed, 10);
                    if (num >= 1 && num <= 9) return numToLetter[num];
                    else return 'F';
                }
                return 'F';
            }

            function parseSubjectEntry(entry) {
                const match = entry.match(/^([A-Za-z]+)-([A-Z0-9]+)\s*\[.*\]$/);
                if (match) {
                    const subjectCode = match[1];
                    const overallToken = match[2];
                    const gradeLetter = parseOverallGrade(overallToken);
                    return { subjectCode, gradeLetter };
                }
                return null;
            }

            // ---------- MAIN ANALYSIS ----------
            window.analyze = function() {
                if (!fileInput.files || fileInput.files.length === 0) {
                    alert('Please select an Excel file first.');
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheetName = workbook.SheetNames[0];
                        const sheet = workbook.Sheets[sheetName];
                        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                        // reset accumulators
                        gradeSummary = { A:0, B:0, C:0, D:0, E:0, O:0, F:0 };
                        subjectStats = {};
                        candidatePoints = [];

                        rows.forEach(row => {
                            const indexNo = row['IndexNo'] || row['Index No.'] || '';
                            const name = row['Candidate_Name'] || row['Candidate Name'] || '';
                            const sexRaw = row['Sex'] || '';
                            const sex = sexRaw.toString().trim().charAt(0).toUpperCase() === 'M' ? 'M' : 'F';
                            const subjectsStr = row['Subjects'] || row['subject'] || '';

                            const tokens = subjectsStr.toString().split(/\s+/);
                            let totalPoints = 0;
                            const subjectDetails = [];

                            tokens.forEach(token => {
                                if (!token.includes('-') || !token.includes('[')) return;
                                const parsed = parseSubjectEntry(token);
                                if (!parsed) return;
                                const { subjectCode, gradeLetter } = parsed;
                                if (gradeSummary.hasOwnProperty(gradeLetter)) {
                                    gradeSummary[gradeLetter] += 1;
                                } else {
                                    gradeSummary['F'] += 1;
                                }
                                const points = gradePoints[gradeLetter] || 0;
                                totalPoints += points;
                                subjectDetails.push({ code: subjectCode, grade: gradeLetter });

                                if (!subjectStats[subjectCode]) {
                                    subjectStats[subjectCode] = { totalPoints: 0, count: 0 };
                                }
                                subjectStats[subjectCode].totalPoints += points;
                                subjectStats[subjectCode].count += 1;
                            });

                            candidatePoints.push({
                                index: indexNo,
                                name: name,
                                sex: sex,
                                points: totalPoints,
                                subjects: subjectDetails
                            });
                        });

                        if (candidatePoints.length === 0) {
                            alert('No valid candidate data found. Check file format.');
                            return;
                        }

                        candidatePoints.sort((a,b) => b.points - a.points);
                        bestFifteen = candidatePoints.slice(0, 15);

                        renderReport();
                        drawCharts();
                        chartRow.style.display = 'flex';
                    } catch (err) {
                        alert('Error processing file: ' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            // ---------- RENDER ----------
            function renderReport() {
                const totalCandidates = candidatePoints.length;
                const totalF = gradeSummary.F || 0;
                const passed = totalCandidates - totalF;
                const passPercent = totalCandidates ? ((passed / totalCandidates) * 100).toFixed(1) : 0;

                const bestMale = candidatePoints.find(c => c.sex === 'M') || null;
                const bestFemale = candidatePoints.find(c => c.sex === 'F') || null;

                let html = `
                    <div class="info-cards">
                        <div class="card"><h3>📋 Candidates Sat</h3><div class="big-number">${totalCandidates}</div></div>
                        <div class="card"><h3>✅ Pass Percentage</h3><div class="big-number">${passPercent}%</div></div>
                        <div class="card"><h3>🏆 Top Points</h3><div class="big-number">${candidatePoints[0]?.points || 0}</div></div>
                    </div>

                    <div class="grade-summary-table">
                        <h3 style="margin-bottom:20px;">📊 GRADE DISTRIBUTION (All Subjects)</h3>
                        <table>
                            <tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>O</th><th>F</th></tr>
                            <tr>
                                <td>${gradeSummary.A}</td>
                                <td>${gradeSummary.B}</td>
                                <td>${gradeSummary.C}</td>
                                <td>${gradeSummary.D}</td>
                                <td>${gradeSummary.E}</td>
                                <td>${gradeSummary.O}</td>
                                <td>${gradeSummary.F}</td>
                            </tr>
                        </table>
                    </div>

                    <div style="display:flex; gap:40px; flex-wrap:wrap; margin:20px 0;">
                        ${bestMale ? `<div class="card"><h3>👤 Best Male</h3>${bestMale.name}<br>Index: ${bestMale.index}<br><span class="badge">${bestMale.points} pts</span></div>` : ''}
                        ${bestFemale ? `<div class="card"><h3>👩 Best Female</h3>${bestFemale.name}<br>Index: ${bestFemale.index}<br><span class="badge">${bestFemale.points} pts</span></div>` : ''}
                    </div>

                    <h2 class="section-title">🏅 BEST 15 CANDIDATES (with subject grades)</h2>
                    <table class="best-table">
                        <thead><tr><th>Rank</th><th>Index No</th><th>Name</th><th>Sex</th><th>Total Points</th><th>Subject Grades</th></tr></thead>
                        <tbody>
                `;
                bestFifteen.forEach((c, i) => {
                    const gradeStr = c.subjects.map(s => `${s.code}-${s.grade}`).join(', ');
                    html += `<tr><td>${i+1}</td><td>${c.index}</td><td>${c.name}</td><td>${c.sex}</td><td><strong>${c.points}</strong></td><td style="font-size:0.9rem;">${gradeStr}</td></tr>`;
                });
                html += `</tbody></table>`;

                html += `<h2 class="section-title">📋 LEARNER POINTS LIST (All Candidates)</h2>`;
                html += `<table class="points-table"><thead><tr><th>Index No</th><th>Name</th><th>Sex</th><th>Total Points</th></tr></thead><tbody>`;
                candidatePoints.forEach(c => {
                    html += `<tr><td>${c.index}</td><td>${c.name}</td><td>${c.sex}</td><td>${c.points}</td></tr>`;
                });
                html += `</tbody></table>`;

                reportArea.innerHTML = html;
            }

            // charts
            function drawCharts() {
                if (!gradeSummary) return;
                const ctx1 = document.getElementById('gradeChart').getContext('2d');
                const ctx2 = document.getElementById('subjectChart').getContext('2d');
                Chart.getChart('gradeChart')?.destroy();
                Chart.getChart('subjectChart')?.destroy();

                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['A','B','C','D','E','O','F'],
                        datasets: [{
                            label: 'Grade frequency',
                            data: [gradeSummary.A, gradeSummary.B, gradeSummary.C, gradeSummary.D, gradeSummary.E, gradeSummary.O, gradeSummary.F],
                            backgroundColor: '#1b7f99'
                        }]
                    }
                });

                if (subjectStats && Object.keys(subjectStats).length) {
                    const labels = [], avgs = [];
                    for (let sub in subjectStats) {
                        labels.push(sub);
                        const avg = subjectStats[sub].totalPoints / subjectStats[sub].count;
                        avgs.push(avg.toFixed(2));
                    }
                    new Chart(ctx2, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Avg points per subject',
                                data: avgs,
                                backgroundColor: '#0f8c7a'
                            }]
                        }
                    });
                }
            }

            // EXPORT EXCEL
            window.downloadExcel = function() {
                if (!candidatePoints.length) return alert('Nothing to export. Run analysis first.');
                const exportRows = candidatePoints.map(c => ({
                    'IndexNo': c.index,
                    'Name': c.name,
                    'Sex': c.sex,
                    'Total Points': c.points,
                    'Subject Grades': c.subjects.map(s => `${s.code}-${s.grade}`).join('; ')
                }));
                const ws = XLSX.utils.json_to_sheet(exportRows);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, 'UACE Points');
                XLSX.writeFile(wb, 'UACE_Advanced_Report.xlsx');
            };

            // PDF EXPORT
            window.downloadPDF = async function() {
                if (!candidatePoints.length) return alert('No data to export.');
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape', 'mm', 'a4');
                const reportElement = document.getElementById('reportArea');
                const clone = reportElement.cloneNode(true);
                clone.style.background = 'white';
                clone.style.padding = '15px';
                const container = document.createElement('div');
                container.appendChild(clone);
                document.body.appendChild(container);
                try {
                    const canvas = await html2canvas(container, { scale: 1.5, logging: false, backgroundColor: '#ffffff' });
                    const imgData = canvas.toDataURL('image/png');
                    const imgWidth = 280;
                    const pageHeight = 210;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    let heightLeft = imgHeight;
                    let position = 10;

                    doc.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;

                    while (heightLeft > 0) {
                        position = heightLeft - imgHeight + 10;
                        doc.addPage();
                        doc.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }
                    doc.save('UACE_Report.pdf');
                } finally {
                    document.body.removeChild(container);
                }
            };
        })();
    </script>
</body>
</html>
