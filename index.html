<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UACE Advanced Analysis · Mawerere Francis</title>
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #eef2f7; min-height: 100vh; }
        /* Login page */
        #loginPage {
            display: flex; justify-content: center; align-items: center; height: 100vh;
            background: #0b2b40; background-image: radial-gradient(circle at 30% 40%, #1a4b63, #07212e);
        }
        .login-card {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(8px); width: 420px; padding: 2.5rem 2rem;
            border-radius: 32px; box-shadow: 0 30px 50px rgba(0,0,0,0.4); text-align: center;
        }
        .login-card h2 {
            font-size: 2.2rem; font-weight: 600; background: linear-gradient(135deg, #0b486b, #1b6b8f);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.25rem;
        }
        .login-card .sub { color: #1e4b62; font-weight: 500; margin-bottom: 2rem; border-bottom: 1px dashed #9bb7c9; padding-bottom: 0.8rem; }
        .input-group { text-align: left; margin-bottom: 1.5rem; }
        .input-group label { font-weight: 600; color: #145369; display: block; margin-bottom: 5px; }
        .input-group input {
            width: 100%; padding: 14px 16px; border: 2px solid #cbdbe9; border-radius: 40px; font-size: 1rem;
            background: white; transition: 0.2s;
        }
        .input-group input:focus { border-color: #1f7990; outline: none; box-shadow: 0 0 0 3px rgba(26,102,128,0.2); }
        .login-btn {
            background: linear-gradient(145deg, #136b80, #0a4b5e); color: white; border: none; padding: 14px 0;
            width: 100%; border-radius: 40px; font-size: 1.2rem; font-weight: 700; cursor: pointer;
            box-shadow: 0 10px 18px -8px #094452; transition: 0.15s; margin-top: 1rem;
        }
        .login-btn:hover { background: linear-gradient(145deg, #0f7f99, #0b5e75); transform: scale(1.01); }
        #loginError { color: #b00020; font-weight: 500; margin-top: 1rem; }
        .developer-credit {
            margin-top: 2.2rem; padding-top: 1.2rem; border-top: 2px dashed #a0c0d0; color: #10455b;
            font-size: 1.1rem; font-weight: 500;
        }
        .developer-credit span { font-weight: 700; color: #003153; }
        .developer-credit small { display: block; font-size: 0.9rem; color: #226578; margin-top: 6px; }
        /* Main page */
        #mainPage { display: none; padding: 30px 25px; max-width: 1400px; margin: 0 auto; }
        .app-header {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 25px;
            background: white; padding: 16px 30px; border-radius: 60px; box-shadow: 0 10px 20px rgba(0,32,64,0.1);
        }
        .app-header h1 { color: #0b3f51; font-weight: 700; font-size: 1.8rem; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-group button {
            background: white; border: 2px solid #10687c; color: #10687c; font-weight: 600; padding: 10px 20px;
            border-radius: 40px; cursor: pointer; font-size: 0.95rem; transition: 0.15s;
        }
        .btn-group button:hover { background: #10687c; color: white; }
        .btn-group .primary-btn { background: #10687c; color: white; }
        .btn-group .primary-btn:hover { background: #0b4f60; }
        .logout-btn { background: #a03d3d !important; border-color: #8b2e2e !important; color: white !important; }
        .logout-btn:hover { background: #7f2f2f !important; }
        .upload-area {
            background: white; padding: 25px; border-radius: 36px; margin-bottom: 25px; box-shadow: 0 10px 18px rgba(0,40,60,0.1);
            display: flex; align-items: center; gap: 25px; flex-wrap: wrap;
        }
        .file-btn {
            background: #e3f0f5; border: 2px dashed #3f9eb7; padding: 14px 28px; border-radius: 40px;
            font-weight: 600; color: #105e74; cursor: pointer; font-size: 1rem;
        }
        .file-btn:hover { background: #cde3ec; border-style: solid; }
        #excelFile { display: none; }
        .info-cards { display: flex; gap: 25px; flex-wrap: wrap; margin-bottom: 30px; }
        .card {
            background: white; border-radius: 28px; padding: 20px 30px; box-shadow: 0 12px 24px -8px rgba(2,60,80,0.2);
            flex: 1 1 200px; border: 1px solid rgba(100,180,200,0.3);
        }
        .card h3 { color: #0b5f78; font-weight: 600; font-size: 1.2rem; margin-bottom: 10px; }
        .card .big-number { font-size: 3rem; font-weight: 800; color: #0a3a48; line-height: 1; }
        .grade-summary-table, .subject-summary-table, .subsidiary-table, .principles-table {
            background: white; border-radius: 28px; padding: 25px; margin: 30px 0; box-shadow: 0 12px 28px rgba(0,50,70,0.15);
        }
        .grade-summary-table table, .subject-summary-table table, .subsidiary-table table, .principles-table table {
            width: 100%; border-collapse: collapse; text-align: center; font-size: 0.9rem;
        }
        .grade-summary-table th, .subject-summary-table th, .subsidiary-table th, .principles-table th {
            background: #104f63; color: white; padding: 10px 0; font-weight: 600;
        }
        .grade-summary-table td, .subject-summary-table td, .subsidiary-table td, .principles-table td {
            padding: 8px 0; background: #f6fbfe; border: 1px solid #bdd7e4;
        }
        .section-title {
            font-size: 2rem; font-weight: 700; margin: 40px 0 20px; color: #0b4153;
            border-left: 10px solid #0d6f88; padding-left: 20px;
        }
        .best-table, .points-table {
            width: 100%; border-collapse: collapse; background: white; border-radius: 24px; overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1); margin-bottom: 40px;
        }
        .best-table th, .points-table th { background: #063b49; color: white; padding: 12px 8px; font-weight: 600; }
        .best-table td, .points-table td { padding: 10px 8px; border-bottom: 1px solid #cbdbe9; text-align: left; }
        .best-table td:first-child, .points-table td:first-child { text-align: center; }
        .best-table td:nth-child(5), .points-table td:nth-child(4) { text-align: center; } /* points column */
        .best-table td:nth-child(6) { text-align: center; } /* principle passes column */
        .best-table tr:nth-child(even), .points-table tr:nth-child(even) { background: #f3f9ff; }
        .badge {
            background: #0d6f88; color: white; border-radius: 40px; padding: 4px 12px; font-weight: 500;
            display: inline-block;
        }
        .chart-row { display: flex; flex-wrap: wrap; gap: 20px; margin: 40px 0; }
        .chart-box { flex: 1 1 400px; background: white; border-radius: 30px; padding: 20px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); }
        canvas { max-height: 300px; }
        footer { text-align: center; margin-top: 50px; color: #1d6177; font-weight: 500; }
        @media print {
            .no-print, .btn-group, .upload-area, footer, .chart-row { display: none; }
            body { background: white; } #mainPage { display: block; padding: 0; }
            table { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="loginPage">
        <div class="login-card">
            <h2>UACE</h2>
            <div class="sub">Advanced Analysis System</div>
            <div class="input-group"><label>Username</label><input type="text" id="username" value="admin"></div>
            <div class="input-group"><label>Password</label><input type="password" id="password" value="1234"></div>
            <button class="login-btn" onclick="login()">LOGIN & ACCESS</button>
            <p id="loginError"></p>
            <div class="developer-credit">
                <span>Developed by Mawerere Francis</span><br>
                <small>📞 TEL: 0788223215 &nbsp; | &nbsp; WhatsApp: +256788223215</small>
            </div>
        </div>
    </div>

    <!-- MAIN APPLICATION -->
    <div id="mainPage">
        <div class="app-header">
            <h1>📊 UACE RESULT ANALYZER</h1>
            <div class="btn-group">
                <button class="primary-btn" onclick="analyze()">▶ Analyze</button>
                <button onclick="window.print()">🖨️ Print</button>
                <button onclick="downloadExcel()">📥 Excel</button>
                <button onclick="downloadPDF()">📄 PDF</button>
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>

        <div class="upload-area no-print">
            <button class="file-btn" onclick="document.getElementById('excelFile').click()">📂 Choose Excel File</button>
            <input type="file" id="excelFile" accept=".xlsx,.xls">
            <span style="color:#136476;">Upload UACE sheet (columns: IndexNo, Sex, Candidate_Name, Res. Code, Subjects)</span>
        </div>

        <div id="reportArea"></div>
        <div class="chart-row no-print" id="chartRow" style="display: none;">
            <div class="chart-box"><canvas id="gradeChart"></canvas></div>
            <div class="chart-box"><canvas id="subjectChart"></canvas></div>
        </div>
        <footer class="no-print">UACE Analytics © Mawerere Francis — 0788223215 / +256788223215</footer>
    </div>

    <script>
        (function() {
            // ---------- CONFIG ----------
            const gradePoints = { 'A':6, 'B':5, 'C':4, 'D':3, 'E':2, 'O':1, 'F':0 };
            // numeric grade to letter for subsidiary subjects (1-6 -> O, 7-9 -> F)
            function numericToGrade(num) {
                if (num >= 1 && num <= 6) return 'O';
                return 'F';
            }

            // subject code to full name mapping (with additions)
            const SUBJECT_NAMES = {
                ENG: "ENGLISH", HIS: "HISTORY", GEO: "GEOGRAPHY", MAT: "MATHEMATICS", MTC: "MATHEMATICS",
                PHY: "PHYSICS", CHE: "CHEMISTRY", BIO: "BIOLOGY", IPS: "IPS",
                CRE: "CRE", COM: "COMMERCE", IRE: "IRE", AGR: "AGRICULTURE",
                DHP: "DHOPADHOLA", LIT: "LITERATURE IN ENGLISH", ENT: "ENTREPRENEURSHIP EDUCATION",
                KIS: "KISWAHILI", LAN: "LANGO", PE: "PHYSICAL EDUCATION", PA: "PERFORMING ARTS",
                FRE: "FRENCH", ECO: "ECONOMICS", ECON: "ECONOMICS",
                // subsidiaries
                GEP: "GENERAL PAPER", CST: "ICT (SUBSIDIARY)", SMA: "SUB-MTC (SUBSIDIARY)"
            };

            // subsidiary codes
            const subsidiaryCodes = new Set(['GEP', 'CST', 'SMA']);

            // global data stores
            let gradeSummary = { A:0, B:0, C:0, D:0, E:0, O:0, F:0 };
            // For principle subjects (excluding subsidiaries): { fullName: { A, B, C, D, E, O, F, total, pass } }
            let principleSubjectStats = {};
            // For subsidiary subjects: { fullName: { grade1..9 counts, total, pass } }
            let subsidiarySubjectStats = {};
            let candidatePoints = [];      // { index, name, sex, points, principlePasses }
            let bestFifteen = [];
            let principlePassCounts = { '3':0, '2':0, '1':0, '0':0 }; // number of candidates with 3,2,1,0 principle passes

            // DOM elements
            const loginPage = document.getElementById('loginPage');
            const mainPage = document.getElementById('mainPage');
            const loginError = document.getElementById('loginError');
            const username = document.getElementById('username');
            const password = document.getElementById('password');
            const fileInput = document.getElementById('excelFile');
            const reportArea = document.getElementById('reportArea');
            const chartRow = document.getElementById('chartRow');

            // ---------- LOGIN ----------
            window.login = function() {
                if (username.value.trim() === 'admin' && password.value.trim() === '1234') {
                    loginPage.style.display = 'none';
                    mainPage.style.display = 'block';
                    loginError.innerText = '';
                } else {
                    loginError.innerText = '❌ Invalid credentials. Use admin / 1234';
                }
            };
            document.addEventListener('keypress', e => {
                if (e.key === 'Enter' && loginPage.style.display !== 'none') window.login();
            });

            // ---------- LOGOUT ----------
            window.logout = function() {
                reportArea.innerHTML = '';
                chartRow.style.display = 'none';
                fileInput.value = '';
                mainPage.style.display = 'none';
                loginPage.style.display = 'flex';
                Chart.getChart('gradeChart')?.destroy();
                Chart.getChart('subjectChart')?.destroy();
            };

            // ---------- PARSING ----------
            function parseOverallGrade(token, isSubsidiary) {
                if (!token || token.trim() === '') return 'F';
                const trimmed = token.trim();
                if (isSubsidiary) {
                    // numeric grade expected (e.g., "5", "9")
                    const num = parseInt(trimmed, 10);
                    if (!isNaN(num) && num >= 1 && num <= 9) {
                        return num; // return numeric for subsidiary grading
                    }
                    return 9; // treat as F9
                } else {
                    // principle subject: letter grade (A-F, O)
                    const first = trimmed.charAt(0).toUpperCase();
                    if (gradePoints.hasOwnProperty(first)) return first;
                    return 'F';
                }
            }

            function parseSubjectEntry(entry) {
                // matches "SUBJECT-GRADE [paper details]"
                const regex = /^([A-Za-z]+)-([A-Z0-9]+)\s*\[.*\]$/;
                const match = entry.match(regex);
                if (!match) return null;
                const code = match[1];
                const overallToken = match[2];
                const isSub = subsidiaryCodes.has(code);
                const grade = parseOverallGrade(overallToken, isSub);
                return { code, grade, isSubsidiary: isSub };
            }

            // ---------- ANALYSIS ----------
            window.analyze = function() {
                if (!fileInput.files || fileInput.files.length === 0) {
                    alert('Please select an Excel file first.');
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const sheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });

                        // Reset accumulators
                        gradeSummary = { A:0, B:0, C:0, D:0, E:0, O:0, F:0 };
                        principleSubjectStats = {};
                        subsidiarySubjectStats = {};
                        candidatePoints = [];
                        principlePassCounts = { '3':0, '2':0, '1':0, '0':0 };

                        rows.forEach(row => {
                            const indexNo = row['IndexNo'] || row['Index No.'] || '';
                            const name = row['Candidate_Name'] || row['Candidate Name'] || '';
                            const sexRaw = row['Sex'] || '';
                            const sex = sexRaw.toString().trim().charAt(0).toUpperCase() === 'M' ? 'M' : 'F';
                            const subjectsStr = row['Subjects'] || row['subject'] || '';

                            // Split by spaces, but combine subject code + bracket
                            const parts = subjectsStr.toString().split(/\s+/);
                            let combinedTokens = [];
                            for (let i = 0; i < parts.length; i++) {
                                if (parts[i].startsWith('[')) {
                                    // attach to previous token if exists
                                    if (combinedTokens.length > 0) {
                                        combinedTokens[combinedTokens.length-1] += ' ' + parts[i];
                                    } else {
                                        // orphan bracket? ignore
                                    }
                                } else {
                                    combinedTokens.push(parts[i]);
                                }
                            }

                            let totalPoints = 0;
                            let principlePasses = 0; // count of A-E in principle subjects
                            const subjectDetails = [];

                            combinedTokens.forEach(token => {
                                if (!token.includes('-') || !token.includes('[')) return;
                                const parsed = parseSubjectEntry(token);
                                if (!parsed) return;
                                const { code, grade, isSubsidiary } = parsed;
                                const fullName = SUBJECT_NAMES[code] || code; // fallback to code if not in map

                                let gradeLetter;
                                if (isSubsidiary) {
                                    // grade is numeric (1-9)
                                    gradeLetter = numericToGrade(grade); // O or F for overall summary
                                    // update subsidiary stats
                                    if (!subsidiarySubjectStats[fullName]) {
                                        // initialize with 1-9 counts
                                        let obj = { total:0, pass:0 };
                                        for (let i=1; i<=9; i++) obj[i] = 0;
                                        subsidiarySubjectStats[fullName] = obj;
                                    }
                                    subsidiarySubjectStats[fullName][grade] += 1;
                                    subsidiarySubjectStats[fullName].total += 1;
                                    if (grade >=1 && grade <=6) subsidiarySubjectStats[fullName].pass += 1;
                                } else {
                                    gradeLetter = grade; // letter
                                    // update principle stats
                                    if (!principleSubjectStats[fullName]) {
                                        principleSubjectStats[fullName] = { A:0, B:0, C:0, D:0, E:0, O:0, F:0, total:0, pass:0 };
                                    }
                                    principleSubjectStats[fullName][gradeLetter] += 1;
                                    principleSubjectStats[fullName].total += 1;
                                    if (['A','B','C','D','E'].includes(gradeLetter)) {
                                        principleSubjectStats[fullName].pass += 1;
                                    }
                                }

                                // Update overall grade summary (using gradeLetter for consistency)
                                if (gradeSummary.hasOwnProperty(gradeLetter)) gradeSummary[gradeLetter] += 1;
                                else gradeSummary['F'] += 1;

                                const points = gradePoints[gradeLetter] || 0;
                                totalPoints += points;

                                // Count principle passes (A-E) for principle subjects only
                                if (!isSubsidiary && ['A','B','C','D','E'].includes(gradeLetter)) {
                                    principlePasses += 1;
                                }

                                subjectDetails.push({ code: fullName, grade: gradeLetter });
                            });

                            candidatePoints.push({
                                index: indexNo,
                                name: name,
                                sex: sex,
                                points: totalPoints,
                                principlePasses: principlePasses,
                                subjects: subjectDetails
                            });

                            // Update principle pass counts
                            if (principlePasses >= 3) principlePassCounts['3'] += 1;
                            else if (principlePasses === 2) principlePassCounts['2'] += 1;
                            else if (principlePasses === 1) principlePassCounts['1'] += 1;
                            else principlePassCounts['0'] += 1;
                        });

                        if (candidatePoints.length === 0) {
                            alert('No valid candidate data found. Check file format.');
                            return;
                        }

                        // Sort by points descending, then by name
                        candidatePoints.sort((a,b) => b.points - a.points || a.name.localeCompare(b.name));
                        bestFifteen = candidatePoints.slice(0, 15);

                        renderReport();
                        drawCharts();
                        chartRow.style.display = 'flex';
                    } catch (err) {
                        alert('Error processing file: ' + err.message);
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            // ---------- RENDER REPORT ----------
            function renderReport() {
                const totalCandidates = candidatePoints.length;
                const totalF = gradeSummary.F || 0;
                const passed = totalCandidates - totalF;
                const passPercent = totalCandidates ? ((passed / totalCandidates) * 100).toFixed(1) : 0;
                const bestMale = candidatePoints.find(c => c.sex === 'M') || null;
                const bestFemale = candidatePoints.find(c => c.sex === 'F') || null;

                // Sort principle subjects by pass percentage descending
                const principleEntries = Object.entries(principleSubjectStats).map(([name, stats]) => {
                    const passPercent = stats.total ? ((stats.pass / stats.total) * 100).toFixed(1) : 0;
                    return { name, ...stats, passPercent };
                });
                principleEntries.sort((a,b) => b.passPercent - a.passPercent || a.name.localeCompare(b.name));

                // Build principle subjects table
                let principleRows = '';
                principleEntries.forEach(s => {
                    principleRows += `<tr><td style="text-align:left; padding-left:10px;">${s.name}</td>
                        <td>${s.A}</td><td>${s.B}</td><td>${s.C}</td><td>${s.D}</td><td>${s.E}</td><td>${s.O}</td><td>${s.F}</td>
                        <td>${s.total}</td><td>${s.passPercent}%</td></tr>`;
                });

                // Subsidiary subjects: sort by pass percentage descending
                const subsidiaryEntries = Object.entries(subsidiarySubjectStats).map(([name, stats]) => {
                    const passPercent = stats.total ? ((stats.pass / stats.total) * 100).toFixed(1) : 0;
                    return { name, ...stats, passPercent };
                });
                subsidiaryEntries.sort((a,b) => b.passPercent - a.passPercent || a.name.localeCompare(b.name));

                let subsidiaryRows = '';
                subsidiaryEntries.forEach(s => {
                    subsidiaryRows += `<tr><td style="text-align:left; padding-left:10px;">${s.name}</td>
                        <td>${s[1]||0}</td><td>${s[2]||0}</td><td>${s[3]||0}</td><td>${s[4]||0}</td><td>${s[5]||0}</td><td>${s[6]||0}</td><td>${s[7]||0}</td><td>${s[8]||0}</td><td>${s[9]||0}</td>
                        <td>${s.total}</td><td>${s.passPercent}%</td></tr>`;
                });

                // Principles obtained table
                const principlesRows = `
                    <tr><td>3</td><td>${principlePassCounts['3']}</td></tr>
                    <tr><td>2</td><td>${principlePassCounts['2']}</td></tr>
                    <tr><td>1</td><td>${principlePassCounts['1']}</td></tr>
                    <tr><td>0</td><td>${principlePassCounts['0']}</td></tr>
                `;

                let html = `
                    <div class="info-cards">
                        <div class="card"><h3>📋 Candidates Sat</h3><div class="big-number">${totalCandidates}</div></div>
                        <div class="card"><h3>✅ Pass Percentage</h3><div class="big-number">${passPercent}%</div></div>
                        <div class="card"><h3>🏆 Top Points</h3><div class="big-number">${candidatePoints[0]?.points || 0}</div></div>
                    </div>

                    <!-- Overall Grade Distribution -->
                    <div class="grade-summary-table">
                        <h3 style="margin-bottom:20px;">📊 OVERALL GRADE DISTRIBUTION (All Subjects)</h3>
                        <table>
                            <tr><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>O</th><th>F</th></tr>
                            <tr>
                                <td>${gradeSummary.A}</td><td>${gradeSummary.B}</td><td>${gradeSummary.C}</td>
                                <td>${gradeSummary.D}</td><td>${gradeSummary.E}</td><td>${gradeSummary.O}</td><td>${gradeSummary.F}</td>
                            </tr>
                        </table>
                    </div>

                    <!-- Principle Subjects (ranked by pass %) -->
                    <div class="subject-summary-table">
                        <h3 style="margin-bottom:20px;">📚 PRINCIPLE SUBJECTS (A-E = Pass) - Ranked by %Pass</h3>
                        <table>
                            <thead><tr><th>Subject</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>O</th><th>F</th><th>Sat</th><th>%Pass</th></tr></thead>
                            <tbody>${principleRows || '<tr><td colspan="10">No principle subject data</td></tr>'}</tbody>
                        </table>
                    </div>

                    <!-- Subsidiary Subjects (GEP, CST, SMA) with numeric grades -->
                    <div class="subsidiary-table">
                        <h3 style="margin-bottom:20px;">📊 SUBSIDIARY SUBJECTS (1-6 = Pass) - Ranked by %Pass</h3>
                        <table>
                            <thead><tr><th>Subject</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>Sat</th><th>%Pass</th></tr></thead>
                            <tbody>${subsidiaryRows || '<tr><td colspan="11">No subsidiary data</td></tr>'}</tbody>
                        </table>
                    </div>

                    <!-- Principles Obtained Table -->
                    <div class="principles-table">
                        <h3 style="margin-bottom:20px;">🎓 NUMBER OF PRINCIPLE PASSES PER CANDIDATE</h3>
                        <table>
                            <thead><tr><th>Principle Passes</th><th>Number of Candidates</th></tr></thead>
                            <tbody>${principlesRows}</tbody>
                        </table>
                    </div>

                    <div style="display:flex; gap:40px; flex-wrap:wrap; margin:20px 0;">
                        ${bestMale ? `<div class="card"><h3>👤 Best Male</h3>${bestMale.name}<br>Index: ${bestMale.index}<br><span class="badge">${bestMale.points} pts</span><br>Principle passes: ${bestMale.principlePasses}</div>` : ''}
                        ${bestFemale ? `<div class="card"><h3>👩 Best Female</h3>${bestFemale.name}<br>Index: ${bestFemale.index}<br><span class="badge">${bestFemale.points} pts</span><br>Principle passes: ${bestFemale.principlePasses}</div>` : ''}
                    </div>

                    <h2 class="section-title">🏅 BEST 15 CANDIDATES</h2>
                    <table class="best-table">
                        <thead><tr><th>Rank</th><th>Index No</th><th>Name</th><th>Sex</th><th>Total Points</th><th>Principle Passes</th></tr></thead>
                        <tbody>
                `;
                bestFifteen.forEach((c, i) => {
                    html += `<tr><td>${i+1}</td><td>${c.index}</td><td style="text-align:left;">${c.name}</td><td>${c.sex}</td><td>${c.points}</td><td>${c.principlePasses}</td></tr>`;
                });
                html += `</tbody></table>`;

                html += `<h2 class="section-title">📋 LEARNER POINTS LIST (All Candidates)</h2>`;
                html += `<table class="points-table"><thead><tr><th>Index No</th><th>Name</th><th>Sex</th><th>Total Points</th></tr></thead><tbody>`;
                candidatePoints.forEach(c => {
                    html += `<tr><td>${c.index}</td><td style="text-align:left;">${c.name}</td><td>${c.sex}</td><td>${c.points}</td></tr>`;
                });
                html += `</tbody></table>`;

                reportArea.innerHTML = html;
            }

            // ---------- CHARTS ----------
            function drawCharts() {
                if (!gradeSummary) return;
                const ctx1 = document.getElementById('gradeChart').getContext('2d');
                const ctx2 = document.getElementById('subjectChart').getContext('2d');
                Chart.getChart('gradeChart')?.destroy();
                Chart.getChart('subjectChart')?.destroy();

                new Chart(ctx1, {
                    type: 'bar',
                    data: {
                        labels: ['A','B','C','D','E','O','F'],
                        datasets: [{
                            label: 'Grade frequency',
                            data: [gradeSummary.A, gradeSummary.B, gradeSummary.C, gradeSummary.D, gradeSummary.E, gradeSummary.O, gradeSummary.F],
                            backgroundColor: '#1b7f99'
                        }]
                    }
                });

                // Subject average points (principle subjects only)
                if (principleSubjectStats && Object.keys(principleSubjectStats).length) {
                    const labels = [], avgs = [];
                    const sorted = Object.keys(principleSubjectStats).sort();
                    sorted.forEach(fullName => {
                        labels.push(fullName);
                        let total = 0, count = 0;
                        const stats = principleSubjectStats[fullName];
                        for (let g in stats) {
                            if (g === 'total' || g === 'pass') continue;
                            total += stats[g] * (gradePoints[g] || 0);
                            count += stats[g];
                        }
                        avgs.push(count ? (total / count).toFixed(2) : 0);
                    });
                    new Chart(ctx2, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Avg points per subject',
                                data: avgs,
                                backgroundColor: '#0f8c7a'
                            }]
                        }
                    });
                }
            }

            // ---------- EXPORT EXCEL (multiple sheets) ----------
            window.downloadExcel = function() {
                if (!candidatePoints.length) return alert('Nothing to export. Run analysis first.');
                const wb = XLSX.utils.book_new();

                // 1. Overall grades
                const overallData = [['Grade','Count']];
                for (let g of ['A','B','C','D','E','O','F']) {
                    overallData.push([g, gradeSummary[g]]);
                }
                let ws = XLSX.utils.aoa_to_sheet(overallData);
                XLSX.utils.book_append_sheet(wb, ws, 'Overall Grades');

                // 2. Principle subjects
                const principleEntries = Object.entries(principleSubjectStats).map(([name, stats]) => ({
                    Subject: name, A: stats.A, B: stats.B, C: stats.C, D: stats.D, E: stats.E, O: stats.O, F: stats.F,
                    Sat: stats.total, PassPercent: stats.total ? ((stats.pass/stats.total)*100).toFixed(1) : 0
                }));
                principleEntries.sort((a,b) => b.PassPercent - a.PassPercent);
                ws = XLSX.utils.json_to_sheet(principleEntries);
                XLSX.utils.book_append_sheet(wb, ws, 'Principle Subjects');

                // 3. Subsidiary subjects
                const subsidiaryEntries = Object.entries(subsidiarySubjectStats).map(([name, stats]) => {
                    let obj = { Subject: name, Sat: stats.total, PassPercent: stats.total ? ((stats.pass/stats.total)*100).toFixed(1) : 0 };
                    for (let i=1; i<=9; i++) obj[`Grade ${i}`] = stats[i] || 0;
                    return obj;
                });
                subsidiaryEntries.sort((a,b) => b.PassPercent - a.PassPercent);
                ws = XLSX.utils.json_to_sheet(subsidiaryEntries);
                XLSX.utils.book_append_sheet(wb, ws, 'Subsidiary Subjects');

                // 4. Principles obtained
                const principlesData = [['Principle Passes','Number of Candidates']];
                principlesData.push(['3', principlePassCounts['3']]);
                principlesData.push(['2', principlePassCounts['2']]);
                principlesData.push(['1', principlePassCounts['1']]);
                principlesData.push(['0', principlePassCounts['0']]);
                ws = XLSX.utils.aoa_to_sheet(principlesData);
                XLSX.utils.book_append_sheet(wb, ws, 'Principles Obtained');

                // 5. Best 15
                const best15Data = bestFifteen.map((c,i) => ({
                    Rank: i+1,
                    IndexNo: c.index,
                    Name: c.name,
                    Sex: c.sex,
                    TotalPoints: c.points,
                    PrinciplePasses: c.principlePasses
                }));
                ws = XLSX.utils.json_to_sheet(best15Data);
                XLSX.utils.book_append_sheet(wb, ws, 'Best 15');

                // 6. All candidates
                const allCandsData = candidatePoints.map(c => ({
                    IndexNo: c.index,
                    Name: c.name,
                    Sex: c.sex,
                    TotalPoints: c.points,
                    PrinciplePasses: c.principlePasses
                }));
                ws = XLSX.utils.json_to_sheet(allCandsData);
                XLSX.utils.book_append_sheet(wb, ws, 'All Candidates');

                XLSX.writeFile(wb, 'UACE_Full_Report.xlsx');
            };

            // ---------- EXPORT PDF ----------
            window.downloadPDF = async function() {
                if (!candidatePoints.length) return alert('No data to export.');
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF('landscape', 'mm', 'a4');
                const reportElement = document.getElementById('reportArea');
                // Clone to avoid modifying original
                const clone = reportElement.cloneNode(true);
                clone.style.background = 'white';
                clone.style.padding = '15px';
                clone.style.width = '1100px'; // enforce width for consistent capture
                const container = document.createElement('div');
                container.appendChild(clone);
                document.body.appendChild(container);
                try {
                    const canvas = await html2canvas(container, { scale: 1.5, backgroundColor: '#ffffff', logging: false });
                    const imgData = canvas.toDataURL('image/png');
                    const imgWidth = 280; // A4 landscape width in mm
                    const pageHeight = 210;
                    const imgHeight = (canvas.height * imgWidth) / canvas.width;
                    let heightLeft = imgHeight;
                    let position = 10;
                    doc.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                    while (heightLeft > 0) {
                        position = heightLeft - imgHeight + 10;
                        doc.addPage();
                        doc.addImage(imgData, 'PNG', 10, position, imgWidth, imgHeight);
                        heightLeft -= pageHeight;
                    }
                    doc.save('UACE_Full_Report.pdf');
                } finally {
                    document.body.removeChild(container);
                }
            };
        })();
    </script>
</body>
